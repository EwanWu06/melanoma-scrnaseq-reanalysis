# environment.lock.yml
# Pinned core package versions for reproducibility.
# Versions verified two ways: (1) conda export snapshot
# docs/environment_backup_before_scgen.yml (2026-05-22), and
# (2) notebook runtime prints across Stages 1-3 (nb01-05 import banners).
# See README "Reproducibility & Data Access".
#
# NOTE: scvi-tools / scGen are intentionally absent. These count/VAE methods
# were evaluated and ruled out (see docs/decision_log.md entries a-b, f);
# no notebook imports them, and the 2026-05-22 conda export contains no
# scvi package (i.e. scvi-tools was declared but never actually installed).
#
# Versions are pinned WITHOUT build strings for cross-platform portability:
# the conda export's build hashes (e.g. py311hbd1492f_0) are macOS/arm64
# specific and would fail to solve on Linux.
name: melanoma-scrnaseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - scanpy=1.11.5
  - anndata=0.12.14
  - harmonypy=0.2.0
  - leidenalg=0.10.2
  - louvain
  - python-igraph=0.11.9
  - numpy=2.4.5
  - scipy=1.17.1
  - scikit-learn=1.8.0
  - numba=0.65.1
  - pip
  # Pip-only (no conda package)
  - pip:
    - bbknn==1.6.0   # Stage 3 Method 2 — graph-based BBKNN (Polanski et al. 2020)
