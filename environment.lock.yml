# environment.lock.yml
# Pinned core package versions (build strings omitted for cross-platform use).
# Versions were confirmed for notebooks 00-07 from a conda export of the
# analysis environment and the version banners printed in notebooks 01-05.
# Notebooks 08-09 did not print versions and are assumed to have run in the
# same environment.
name: melanoma-scrnaseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - scanpy=1.11.5
  - anndata=0.12.14
  - harmonypy=0.2.0
  - leidenalg=0.10.2
  - louvain
  - python-igraph=0.11.9
  - numpy=2.4.5
  - scipy=1.17.1
  - scikit-learn=1.8.0
  - numba=0.65.1
  - pip
  # Pip-only (no conda package)
  - pip:
    - bbknn==1.6.0
